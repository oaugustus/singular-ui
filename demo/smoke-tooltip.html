<!DOCTYPE html>
<html lang="pt-BR" ng-app="demoApp">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smoke — Tooltip (floating + hotkey)</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        line-height: 1.4;
      }
      #smoke-tooltip-anchor {
        margin-top: 4rem;
        margin-left: 4rem;
      }
      #smoke-tooltip-tip {
        background: #111;
        color: #fff;
        padding: 0.75rem 1rem;
        border-radius: 4px;
        z-index: 10;
        min-width: 12rem;
      }
      .status {
        margin-top: 2rem;
        padding: 1rem;
        background: #f5f5f5;
        border-radius: 4px;
      }
      .status dt {
        font-weight: 600;
      }
      .status dd {
        margin: 0 0 0.5rem 0;
      }
    </style>
  </head>
  <body ng-controller="SmokeTooltipController as vm">
    <p>
      <a href="/demo/index.html">← Demo</a>
    </p>
    <h1>Smoke tooltip (§6.7)</h1>
    <p>
      Valida <code>ge-floating-position</code>, <code>ge-focus-trap</code> e
      <code>ge-hotkey</code> (ESC). Descartável — Tooltip real nasce na Etapa 4.
    </p>

    <button type="button" id="smoke-tooltip-anchor" ng-click="vm.openTooltip()">
      Abrir tooltip
    </button>

    <!--
      Isolates aninhados (um por elemento). Tip fica sob o ng-if (perto do body)
      para o offsetParent do Floating UI coincidir com a referência.
      Hotkey envolve o conteúdo focável para o ESC borbulhar até o Mousetrap local.
    -->
    <div ng-if="vm.open">
      <div
        id="smoke-tooltip-tip"
        ge-floating-position
        reference="vm.anchor"
        placement="bottom"
        offset="8"
      >
        <div ge-hotkey key="esc" on-trigger="$parent.vm.close()" tabindex="-1">
          <div ge-focus-trap active="$parent.$parent.vm.open">
            Tooltip de teste
            <button type="button" id="smoke-tooltip-inside">Dentro</button>
            <button type="button" ng-click="$parent.onTrigger()">
              Fechar
            </button>
          </div>
        </div>
      </div>
    </div>

    <dl class="status">
      <dt>Aberto / trap ativo</dt>
      <dd>{{ vm.open ? 'sim' : 'não' }}</dd>
      <dt>Posição calculada</dt>
      <dd>{{ vm.positionLabel }}</dd>
      <dt>ESC disparado</dt>
      <dd>{{ vm.escFired ? 'sim' : 'não' }}</dd>
    </dl>

    <script src="/node_modules/angular/angular.js"></script>
    <script src="/node_modules/angular-aria/angular-aria.js"></script>
    <script src="/node_modules/angular-animate/angular-animate.js"></script>

    <script src="/node_modules/@floating-ui/core/dist/floating-ui.core.umd.js"></script>
    <script src="/node_modules/@floating-ui/dom/dist/floating-ui.dom.umd.js"></script>
    <script src="/node_modules/tabbable/dist/index.umd.js"></script>
    <script src="/node_modules/focus-trap/dist/focus-trap.umd.js"></script>
    <script src="/node_modules/mousetrap/mousetrap.js"></script>

    <script src="/src/core/core.module.js"></script>
    <script src="/src/core/tv/tv.service.js"></script>
    <script src="/src/core/overlay/overlay-stack.service.js"></script>
    <script src="/src/core/overlay/floating-position.directive.js"></script>
    <script src="/src/core/overlay/focus-trap.directive.js"></script>
    <script src="/src/core/overlay/hotkey.directive.js"></script>
    <script src="/src/gravity-elements.module.js"></script>
    <script src="/demo/app.js"></script>
    <script src="/demo/smoke-tooltip.js"></script>
  </body>
</html>
